<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110e" />
      <stop offset="50%" stop-color="#1f1a14" />
      <stop offset="100%" stop-color="#0c0a08" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)" />
  <circle cx="680" cy="90" r="150" fill="#f59e0b" opacity="0.12" filter="url(#glow2)" />
  <circle cx="150" cy="360" r="140" fill="#d97706" opacity="0.1" filter="url(#glow2)" />

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Browser Mockup -->
  <g transform="translate(160, 45)">
    <rect width="480" height="360" rx="16" fill="#181512" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" />
    
    <!-- Navbar -->
    <rect width="480" height="50" rx="16" fill="#241e17" />
    <rect y="35" width="480" height="15" fill="#241e17" />
    <circle cx="30" cy="25" r="5" fill="#ef4444" />
    <circle cx="48" cy="25" r="5" fill="#f59e0b" />
    <circle cx="66" cy="25" r="5" fill="#10b981" />
    <text x="240" y="30" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">✂️ NANKATSU BARBERSHOP</text>

    <!-- Hero Content -->
    <text x="40" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Classic Cut &amp; Premium Grooming</text>
    <text x="40" y="122" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">Pengalaman potong rambut berkelas dengan barberman profesional.</text>

    <!-- Service Cards -->
    <g transform="translate(40, 145)">
      <rect width="120" height="100" rx="10" fill="#241e17" stroke="#f59e0b" stroke-opacity="0.2" />
      <text x="60" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gentleman Cut</text>
      <text x="60" y="60" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Rp 50.000</text>
      <rect x="25" y="72" width="70" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
      <text x="60" y="85" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Cut + Wash</text>
    </g>

    <g transform="translate(180, 145)">
      <rect width="120" height="100" rx="10" fill="#241e17" stroke="#f59e0b" stroke-opacity="0.4" />
      <text x="60" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Fade &amp; Beard</text>
      <text x="60" y="60" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Rp 75.000</text>
      <rect x="25" y="72" width="70" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
      <text x="60" y="85" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Styling Pomade</text>
    </g>

    <g transform="translate(320, 145)">
      <rect width="120" height="100" rx="10" fill="#241e17" stroke="#f59e0b" stroke-opacity="0.2" />
      <text x="60" y="35" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">VIP Treatment</text>
      <text x="60" y="60" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Rp 120.000</text>
      <rect x="25" y="72" width="70" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
      <text x="60" y="85" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">All-in Package</text>
    </g>

    <!-- Booking CTA Button -->
    <rect x="40" y="270" width="180" height="42" rx="8" fill="url(#goldGrad)" />
    <text x="130" y="296" fill="#1c1917" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📅 Booking Jadwal Cukur</text>

    <!-- Live indicator -->
    <g transform="translate(260, 275)">
      <circle cx="10" cy="15" r="5" fill="#22c55e" />
      <text x="25" y="19" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">barber-nankatsu.vercel.app</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(40, 325)">
      <text x="0" y="15" fill="#78716c" font-family="system-ui, sans-serif" font-size="10" font-weight="500">React.js • Tailwind CSS • Framer Motion • Vercel</text>
    </g>
  </g>
</svg>