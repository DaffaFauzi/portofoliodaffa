<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b24" />
      <stop offset="50%" stop-color="#2c1135" />
      <stop offset="100%" stop-color="#110515" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" />
  <circle cx="700" cy="80" r="160" fill="#e11d48" opacity="0.14" filter="url(#glow4)" />
  <circle cx="120" cy="380" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow4)" />

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Movie Catalog Mockup -->
  <g transform="translate(160, 45)">
    <rect width="480" height="360" rx="16" fill="#1b0b21" stroke="#e11d48" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- Top bar -->
    <rect width="480" height="50" rx="16" fill="#2d1236" />
    <rect y="35" width="480" height="15" fill="#2d1236" />
    <circle cx="30" cy="25" r="5" fill="#ef4444" />
    <circle cx="48" cy="25" r="5" fill="#f59e0b" />
    <circle cx="66" cy="25" r="5" fill="#10b981" />
    <text x="240" y="30" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">🎬 CINEVERSE - MOVIE DISCOVERY APP</text>

    <!-- Search / Filter Pill Bar -->
    <g transform="translate(30, 70)">
      <rect width="180" height="32" rx="6" fill="#120617" stroke="#e11d48" stroke-opacity="0.3" />
      <text x="15" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">🔍 Search blockbuster...</text>
      <rect x="195" y="0" width="60" height="32" rx="6" fill="#e11d48" />
      <text x="225" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">All</text>
      <rect x="265" y="0" width="70" height="32" rx="6" fill="#2d1236" />
      <text x="300" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Action</text>
      <rect x="345" y="0" width="75" height="32" rx="6" fill="#2d1236" />
      <text x="382" y="21" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Sci-Fi</text>
    </g>

    <!-- Movie Posters Row -->
    <g transform="translate(30, 120)">
      <!-- Card 1 -->
      <rect width="125" height="185" rx="8" fill="#2d1236" stroke="#ffffff" stroke-opacity="0.08" />
      <rect width="125" height="110" rx="8" fill="#4c1d56" />
      <text x="62" y="65" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🍿</text>
      <rect x="75" y="10" width="42" height="18" rx="4" fill="#000000" fill-opacity="0.7" />
      <text x="96" y="23" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">★ 8.8</text>
      <text x="10" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Interstellar</text>
      <text x="10" y="150" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10">Sci-Fi, Adventure</text>
      <text x="10" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">2014 • 2h 49m</text>

      <!-- Card 2 -->
      <g transform="translate(145, 0)">
        <rect width="125" height="185" rx="8" fill="#2d1236" stroke="#ffffff" stroke-opacity="0.08" />
        <rect width="125" height="110" rx="8" fill="#3b1544" />
        <text x="62" y="65" fill="#e11d48" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🚀</text>
        <rect x="75" y="10" width="42" height="18" rx="4" fill="#000000" fill-opacity="0.7" />
        <text x="96" y="23" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">★ 8.9</text>
        <text x="10" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Inception</text>
        <text x="10" y="150" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10">Action, Sci-Fi</text>
        <text x="10" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">2010 • 2h 28m</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(290, 0)">
        <rect width="130" height="185" rx="8" fill="#2d1236" stroke="#ffffff" stroke-opacity="0.08" />
        <rect width="130" height="110" rx="8" fill="#581c64" />
        <text x="65" y="65" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🦇</text>
        <rect x="80" y="10" width="42" height="18" rx="4" fill="#000000" fill-opacity="0.7" />
        <text x="101" y="23" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">★ 9.0</text>
        <text x="10" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">The Dark Knight</text>
        <text x="10" y="150" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10">Action, Crime</text>
        <text x="10" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">2008 • 2h 32m</text>
      </g>
    </g>

    <!-- Footer Stack -->
    <g transform="translate(30, 325)">
      <text x="0" y="15" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11" opacity="0.8">React Native • REST API (TMDB) • Context API • Android UI</text>
    </g>
  </g>
</svg>