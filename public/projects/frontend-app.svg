<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2c" />
      <stop offset="50%" stop-color="#241042" />
      <stop offset="100%" stop-color="#0c0517" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)" />
  <circle cx="680" cy="90" r="150" fill="#a855f7" opacity="0.16" filter="url(#glow6)" />
  <circle cx="120" cy="380" r="140" fill="#ec4899" opacity="0.14" filter="url(#glow6)" />

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Modern Frontend App Mockup -->
  <g transform="translate(150, 45)">
    <rect width="500" height="360" rx="16" fill="#1b0f33" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Top Window Bar -->
    <rect width="500" height="50" rx="16" fill="#28144a" />
    <rect y="35" width="500" height="15" fill="#28144a" />
    <circle cx="30" cy="25" r="5" fill="#ef4444" />
    <circle cx="48" cy="25" r="5" fill="#f59e0b" />
    <circle cx="66" cy="25" r="5" fill="#10b981" />
    <text x="250" y="30" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">⚡ MODERN FRONTEND APP - REACT 18 + VITE</text>

    <!-- Hero area -->
    <g transform="translate(30, 75)">
      <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Hi, I'm Daffa 👋</text>
      <text x="0" y="48" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12">Frontend Developer • Mobile Developer • UI/UX Designer</text>
      
      <!-- CTA Button Mock -->
      <rect x="0" y="65" width="140" height="32" rx="8" fill="url(#purpleGrad)" />
      <text x="70" y="86" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">View My Work 🚀</text>

      <!-- Badge Tailwind v4 Aktif -->
      <rect x="155" y="65" width="150" height="32" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
      <text x="230" y="86" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tailwind v4 Aktif ✅</text>
    </g>

    <!-- 3 Animated Skill Feature Cards -->
    <g transform="translate(30, 190)">
      <!-- Card 1 -->
      <rect width="135" height="110" rx="10" fill="#261347" stroke="#a855f7" stroke-opacity="0.3" />
      <circle cx="35" cy="35" r="16" fill="#8b5cf6" />
      <text x="35" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">W</text>
      <text x="15" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Web Development</text>
      <text x="15" y="88" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9">React, Vite &amp; Tailwind</text>

      <!-- Card 2 -->
      <g transform="translate(150, 0)">
        <rect width="135" height="110" rx="10" fill="#261347" stroke="#ec4899" stroke-opacity="0.3" />
        <circle cx="35" cy="35" r="16" fill="#ec4899" />
        <text x="35" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">M</text>
        <text x="15" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mobile Dev</text>
        <text x="15" y="88" fill="#f472b6" font-family="system-ui, sans-serif" font-size="9">Kotlin &amp; Flutter Apps</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(300, 0)">
        <rect width="135" height="110" rx="10" fill="#261347" stroke="#a855f7" stroke-opacity="0.3" />
        <circle cx="35" cy="35" r="16" fill="#a855f7" />
        <text x="35" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">U</text>
        <text x="15" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">UI/UX Design</text>
        <text x="15" y="88" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9">Intuitive &amp; Usable UI</text>
      </g>
    </g>

    <!-- Bottom link footer -->
    <g transform="translate(30, 325)">
      <circle cx="8" cy="10" r="4" fill="#a855f7" />
      <text x="20" y="14" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11">github.com/DaffaFauzi/my-frontend-app</text>
      <text x="310" y="14" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11">React 18 • Framer Motion • Vite</text>
    </g>
  </g>
</svg>