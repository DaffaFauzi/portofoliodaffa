    <rect width="480" height="50" rx="16" fill="#113d35" />
    <rect y="35" width="480" height="15" fill="#113d35" />
    <circle cx="30" cy="25" r="5" fill="#ef4444" />
    <circle cx="48" cy="25" r="5" fill="#f59e0b" />
    <circle cx="66" cy="25" r="5" fill="#10b981" />
    <text x="240" y="30" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏥 SISTEM INFORMASI POSYANDU DIGITAL</text>

    <!-- Header Stats -->
    <g transform="translate(30, 75)">
      <rect width="130" height="75" rx="10" fill="#06221d" stroke="#14b8a6" stroke-opacity="0.3" />
      <text x="15" y="25" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Total Balita</text>
      <text x="15" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">248</text>
      <text x="75" y="55" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11">Aktif</text>
    </g>

    <g transform="translate(175, 75)">
