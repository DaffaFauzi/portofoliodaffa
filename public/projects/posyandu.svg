    <text x="45" y="190" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Pencatatan Perkembangan Balita Terkini</text>
    
    <!-- Table Row 1 -->
    <line x1="45" y1="202" x2="435" y2="202" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="45" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Aisyah Putri</text>
    <text x="160" y="222" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11">14 Bulan</text>
    <text x="240" y="222" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">BB: 9.4 kg (Normal)</text>
    <rect x="360" y="209" width="65" height="18" rx="4" fill="#14b8a6" fill-opacity="0.2" />
    <text x="392" y="222" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Campak ✓</text>

    <!-- Table Row 2 -->
    <line x1="45" y1="237" x2="435" y2="237" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="45" y="257" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Muhammad Rizky</text>
    <text x="160" y="257" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11">9 Bulan</text>
    <text x="240" y="257" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">BB: 8.2 kg (Normal)</text>
    <rect x="360" y="244" width="65" height="18" rx="4" fill="#06b6d4" fill-opacity="0.2" />
    <text x="392" y="257" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Polio 3 ✓</text>

    <!-- Table Row 3 -->
    <line x1="45" y1="272" x2="435" y2="272" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="45" y="287" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">📅 Jadwal Posyandu: Selasa, 10:00 WIB</text>
    <text x="330" y="287" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Railway Deployed 🚀</text>

    <!-- Bottom link info -->
    <g transform="translate(30, 312)">
      <circle cx="8" cy="10" r="4" fill="#14b8a6" />
      <text x="20" y="14" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11">posyandu.up.railway.app</text>
      <text x="240" y="14" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11" opacity="0.7">Laravel • PHP • MySQL • Railway</text>
