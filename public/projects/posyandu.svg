      <text x="15" y="25" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Imunisasi Bulan Ini</text>
      <text x="15" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">86</text>
      <text x="65" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Dosis</text>
    </g>

    <g transform="translate(320, 75)">
