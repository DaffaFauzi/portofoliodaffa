      <text x="15" y="25" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Gizi Baik</text>
      <text x="15" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">96.8%</text>
    </g>

