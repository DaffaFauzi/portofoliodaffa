<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b2c" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#071421" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19486c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0c2338" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad1)" />
  <circle cx="700" cy="80" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow1)" />
  <circle cx="120" cy="380" r="140" fill="#818cf8" opacity="0.12" filter="url(#glow1)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Main Card Graphic Mockup -->
  <g transform="translate(180, 50)">
    <rect width="440" height="350" rx="20" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- App Header bar -->
    <rect width="440" height="60" rx="20" fill="#0c243b" opacity="0.9" />
    <rect y="40" width="440" height="20" fill="#0c243b" opacity="0.9" />
    
    <circle cx="35" cy="30" r="6" fill="#ef4444" />
    <circle cx="55" cy="30" r="6" fill="#f59e0b" />
    <circle cx="75" cy="30" r="6" fill="#10b981" />
    <text x="220" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Kamus Sunda - Indonesia v1.0</text>

    <!-- Search Input Mock -->
    <rect x="35" y="80" width="370" height="42" rx="10" fill="#071b2d" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="60" cy="101" r="7" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="65" y1="106" x2="72" y2="113" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="85" y="106" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Milari kecap / Cari kata...</text>
    <rect x="330" y="87" width="65" height="28" rx="6" fill="#0284c7" />
    <text x="362" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CARI</text>

    <!-- Vocab Item 1 -->
    <rect x="35" y="140" width="370" height="60" rx="12" fill="#092137" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    <text x="55" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Damang</text>
    <rect x="125" y="152" width="55" height="18" rx="4" fill="#38bdf8" fill-opacity="0.15" />
    <text x="152" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Lemes</text>
    <text x="55" y="187" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Terjemahan: Sehat / Baik (Kabar)</text>

    <!-- Vocab Item 2 -->
    <rect x="35" y="212" width="370" height="60" rx="12" fill="#092137" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    <text x="55" y="237" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Hatur Nuhun</text>
    <rect x="155" y="224" width="55" height="18" rx="4" fill="#818cf8" fill-opacity="0.15" />
    <text x="182" y="237" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Lemes</text>
    <text x="55" y="259" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Terjemahan: Terima Kasih Banyak</text>

    <!-- Badge Kotlin Android -->
    <g transform="translate(35, 290)">
      <rect width="120" height="32" rx="8" fill="#7f52ff" fill-opacity="0.2" stroke="#7f52ff" stroke-width="1" />
      <text x="60" y="21" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Kotlin Android</text>
    </g>
    <g transform="translate(165, 290)">
      <rect width="115" height="32" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <text x="57" y="21" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📚 500+ Kosakata</text>
    </g>
    <g transform="translate(290, 290)">
      <rect width="115" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="57" y="21" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Fast &lt; 1 Detik</text>
    </g>
  </g>
</svg>