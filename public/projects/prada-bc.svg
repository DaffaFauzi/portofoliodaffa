      <circle cx="32" cy="151" r="6" fill="#f59e0b" />
      <text x="48" y="147" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Turnamen Internal &amp; Cetak Sertifikat PDF</text>
      <text x="48" y="161" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">19:00 - Selesai • Auto-generate DomPDF</text>

      <!-- Right: Performance & Report Card -->
      <rect x="335" width="205" height="190" rx="12" fill="#112242" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="350" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📄 DomPDF Report Engine</text>
      
      <rect x="350" y="42" width="175" height="75" rx="8" fill="#162a50" stroke="#38bdf8" stroke-opacity="0.2" />
      <text x="362" y="60" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Laporan Fisik Atlet</text>
      <text x="362" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">VO2 Max: 58.4 ml/kg</text>
      <text x="362" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Agility Test: Rank A (Optimal)</text>
      <text x="362" y="102" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Sertifikat Siap Cetak</text>

      <!-- Tech Stack pills inside mockup -->
      <g transform="translate(350, 130)">
        <rect width="80" height="20" rx="4" fill="#0284c7" fill-opacity="0.25" />
        <text x="40" y="14" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Inertia React 19</text>
        <rect x="88" width="87" height="20" rx="4" fill="#059669" fill-opacity="0.25" />
        <text x="131" y="14" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Tailwind v4</text>
        <rect y="26" width="175" height="20" rx="4" fill="#4f46e5" fill-opacity="0.25" />
        <text x="87" y="40" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Artisan Scheduled Worker</text>
      </g>
    </g>
  </g>
</svg>