      <text x="201" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">AUTO-BILLING (SPP)</text>
      <text x="201" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">100% Sync</text>
      <circle cx="327" cy="33" r="12" fill="#0284c7" fill-opacity="0.2" />
      <text x="327" y="37" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡</text>

      <!-- Stat 3 -->
