      <text x="48" y="69" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">08:00 - 10:30 • Court 1 • Coach Pratama</text>

      <!-- Event 2 -->
      <rect x="16" y="86" width="288" height="38" rx="8" fill="#1c3562" />
      <circle cx="32" cy="105" r="6" fill="#38bdf8" />
      <text x="48" y="101" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Latihan Reguler Mingguan Kelas Remaja</text>
      <text x="48" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">14:00 - 17:00 • Court 2 &amp; 3 • 24 Peserta</text>

      <!-- Event 3 -->
