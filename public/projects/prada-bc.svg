    <rect y="36" width="600" height="16" fill="#132446" />
    <circle cx="32" cy="26" r="5" fill="#ef4444" />
    <circle cx="50" cy="26" r="5" fill="#f59e0b" />
    <circle cx="68" cy="26" r="5" fill="#10b981" />
    
    <!-- Title and Badge -->
    <text x="300" y="31" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🏸 PRADA BADMINTON CLUB — CORE &amp; REPORT SYSTEM</text>
    <rect x="495" y="16" width="80" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="535" y="30" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">LARAVEL 12/13</text>

    <!-- Sub Header Stats -->
    <g transform="translate(30, 72)">
      <!-- Stat 1 -->
      <rect width="165" height="65" rx="10" fill="#162c54" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="14" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL ATLET AKTIF</text>
      <text x="14" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">148 Atlet</text>
      <circle cx="140" cy="33" r="12" fill="#10b981" fill-opacity="0.2" />
      <text x="140" y="37" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓</text>

      <!-- Stat 2 -->
