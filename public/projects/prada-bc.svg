      <text x="389" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SCHEDULE COMMAND</text>
      <text x="389" y="50" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Daily Cron</text>
      <circle cx="515" cy="33" r="12" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="515" y="37" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚙</text>
