      <text x="362" y="60" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Caraka KBG Wizard</text>
      <text x="362" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Vue 3 • Pinia • TanStack</text>
      <text x="362" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Zod Schema Validation</text>
      <text x="362" y="102" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ Auto Generate DomPDF</text>

      <!-- Tech Stack pills inside mockup -->
      <g transform="translate(350, 130)">
        <rect width="80" height="20" rx="4" fill="#4f46e5" fill-opacity="0.3" />
