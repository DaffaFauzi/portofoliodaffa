      <line x1="75" y1="85" x2="245" y2="85" stroke="#6366f1" stroke-width="1.5" />
      <line x1="75" y1="85" x2="75" y2="95" stroke="#6366f1" stroke-width="1.5" />
      <line x1="245" y1="85" x2="245" y2="95" stroke="#6366f1" stroke-width="1.5" />

