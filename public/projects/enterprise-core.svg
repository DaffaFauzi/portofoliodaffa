    <rect x="500" y="16" width="75" height="20" rx="10" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-opacity="0.4" />
    <text x="537" y="30" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ENTERPRISE</text>

