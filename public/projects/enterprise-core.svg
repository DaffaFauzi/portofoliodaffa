      <text x="389" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">BROADCASTING</text>
      <text x="389" y="50" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Reverb WS</text>
