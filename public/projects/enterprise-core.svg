        <rect x="88" width="87" height="20" rx="4" fill="#0284c7" fill-opacity="0.3" />
        <text x="131" y="14" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Inertia React</text>
        <rect y="26" width="175" height="20" rx="4" fill="#059669" fill-opacity="0.3" />
        <text x="87" y="40" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Maatwebsite Multi-sheet</text>
      </g>
    </g>
  </g>
</svg>