<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/vite.svg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Daffa Fauzi | Frontend Developer</title>
  <meta name="description" content="Portfolio of Daffa Fauzi, a Frontend Developer specialized in React.js, Vue.js, and TypeScript." />
  <meta name="keywords" content="Daffa Fauzi, Frontend Developer, React Developer, Vue Developer, TypeScript, Portfolio" />
  <meta name="author" content="Daffa Fauzi" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://daffafauzi.com/" />
  <meta property="og:title" content="Daffa Fauzi | Frontend Developer" />
  <meta property="og:description" content="Portfolio of Daffa Fauzi, a Frontend Developer specialized in React.js, Vue.js, and TypeScript." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://daffafauzi.com/" />
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
